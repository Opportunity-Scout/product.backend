name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: befirstapp.com
          port: 22022
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: BRANCH
          script: |
            set -euo pipefail
            cd ~/product.backend
            git fetch origin
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "Deployed branch: $(git branch --show-current) at commit $(git rev-parse --short HEAD)"
            docker compose up -d --build app
            docker compose exec -T app npx prisma migrate deploy
        env:
          BRANCH: ${{ github.ref_name }}
